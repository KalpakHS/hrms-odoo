{% extends "base.html" %}

{% block title %}Dashboard - Dayflow HRMS{% endblock %}

{% block content %}
<h2>Dayflow HRMS Dashboard</h2>
<p>Signed in as: <strong>{{ user.get_full_name|default:user.login_id }}</strong> (Role: <span style="background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-weight: 600;">{{ role }}</span>)</p>

<div style="background: #f1f5f9; padding: 15px; border-radius: 6px; margin: 20px 0;">
    <p><strong>Login ID:</strong> {{ login_id }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
</div>

<div style="display: flex; gap: 10px;">
    <a href="{% url 'accounts:password_change' %}" style="display: inline-block; padding: 10px; background: #e2e8f0; color: #334155; text-decoration: none; border-radius: 6px; font-weight: 600;">Change Password</a>
    <a href="{% url 'accounts:logout' %}" style="display: inline-block; padding: 10px; background: #fee2e2; color: #991b1b; text-decoration: none; border-radius: 6px; font-weight: 600;">Log Out</a>
</div>
{% endblock %}
